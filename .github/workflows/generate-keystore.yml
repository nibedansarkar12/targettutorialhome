name: Generate Android Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ]; then
            echo "Keystore password secret is missing"
            exit 1
          fi

          keytool -genkeypair \
            -v \
            -keystore target-tutorial-release.jks \
            -alias targettutorial \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -dname "CN=Target Tutorial, OU=Education, O=Target Tutorial, L=India, ST=West Bengal, C=IN"

          base64 -w 0 target-tutorial-release.jks > target-tutorial-release.b64

      - name: Upload Keystore Base64
        uses: actions/upload-artifact@v4
        with:
          name: target-tutorial-keystore
          path: target-tutorial-release.b64
          retention-days: 1
          if-no-files-found: error
          
