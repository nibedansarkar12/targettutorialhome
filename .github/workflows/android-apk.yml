name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/target-tutorial-release.jks
          chmod 600 android/app/target-tutorial-release.jks
          test -s android/app/target-tutorial-release.jks

      - name: Build Android APK
        working-directory: android
        env:
          WEB_APP_URL: ${{ vars.WEB_APP_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle assembleDebug -PWEB_APP_URL="$WEB_APP_URL"

      - name: Generate signing report
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle signingReport --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: target-tutorial-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
