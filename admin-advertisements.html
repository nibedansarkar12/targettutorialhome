
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advertisement Admin - Target Tutorial Home</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;
  font-family:Arial,sans-serif;
  background:#0f172a;color:white;
}
.container{max-width:650px;margin:auto}
.card{
  background:#1e293b;padding:20px;
  border-radius:15px;margin:18px 0;
}
h1{font-size:25px}
label{display:block;margin-top:15px;font-weight:bold}
input,textarea{
  width:100%;padding:13px;margin-top:7px;
  border-radius:8px;border:1px solid #64748b;
  font-size:15px;
}
input[type=checkbox]{width:auto}
button{
  padding:12px 18px;margin:10px 5px 0 0;
  border:0;border-radius:8px;
  background:#2563eb;color:white;
  font-weight:bold;cursor:pointer;
}
.danger{background:#dc2626}
.status{
  background:#334155;padding:12px;
  margin-top:15px;border-radius:8px;
  overflow-wrap:anywhere;
}
.preview{
  background:white;color:#111827;
  padding:18px;border-radius:12px;
  margin-top:18px;
}
.hidden{display:none}
</style>
</head>

<body>
<div class="container">

<h1>📢 বিজ্ঞাপন Popup নিয়ন্ত্রণ</h1>
<p>এখান থেকে Android Student App-এর বিজ্ঞাপন চালু ও বন্ধ করতে পারবেন।</p>

<div class="card">
<h2>Admin Login</h2>

<label>Email</label>
<input id="email" type="email" placeholder="Admin Email">

<label>Password</label>
<input id="password" type="password" placeholder="Password">

<button id="login">Login</button>
<button id="logout">Logout</button>

<div id="authStatus" class="status">
প্রথমে Admin Login করুন।
</div>
</div>

<div class="card">
<h2>বিজ্ঞাপনের তথ্য</h2>

<label>
<input type="checkbox" id="enabled">
বিজ্ঞাপন চালু থাকবে
</label>

<label>বিজ্ঞাপনের শিরোনাম</label>
<input id="title" maxlength="100"
placeholder="নতুন ব্যাচে ভর্তি চলছে">

<label>বিজ্ঞাপনের বিবরণ</label>
<textarea id="message" rows="4" maxlength="700"
placeholder="বিজ্ঞাপনের বিস্তারিত লিখুন"></textarea>

<label>বোতামের লেখা</label>
<input id="buttonText" placeholder="আরও জানুন">

<label>বোতামের লিংক</label>
<input id="buttonUrl" type="url"
placeholder="https://example.com">

<p>Popup: প্রতিবার App Open করলে</p>
<p>সময়: সঙ্গে সঙ্গে (০ সেকেন্ড)</p>

<button id="save">Save & Publish</button>
<button id="disable" class="danger">বিজ্ঞাপন বন্ধ করুন</button>

<div id="status" class="status">
Admin Login করুন।
</div>

<div id="preview" class="preview hidden">
<h3 id="previewTitle"></h3>
<p id="previewMessage"></p>
<a id="previewButton" target="_blank"
rel="noopener noreferrer"></a>
</div>
</div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCR5rqthBh0vX0yLOcOG3b9xJiKbYtzdxU",
authDomain: "target-zone-8fffd.firebaseapp.com",
projectId: "target-zone-8fffd",
storageBucket: "target-zone-8fffd.appspot.com",
messagingSenderId: "667579216123",
appId: "1:667579216123:web:37bb1fcc724743073d005e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const adRef = doc(db,"appSettings","advertisementPopup");

const $ = id => document.getElementById(id);

let isAdmin = false;

function showStatus(message){
$("status").textContent = message;
}

function lockForm(locked){
["enabled","title","message","buttonText","buttonUrl","save","disable"]
.forEach(id => $(id).disabled = locked);
}

lockForm(true);

function preview(data){
$("preview").classList.remove("hidden");
$("previewTitle").textContent = data.title || "";
$("previewMessage").textContent = data.message || "";

const link = $("previewButton");

if(data.buttonText && data.buttonUrl){
link.textContent = data.buttonText;
link.href = data.buttonUrl;
link.style.display = "inline-block";
}else{
link.textContent = "";
link.removeAttribute("href");
link.style.display = "none";
}
}

onAuthStateChanged(auth,async user=>{

isAdmin = false;
lockForm(true);

if(!user){
$("authStatus").textContent = "লগইন করা নেই।";
return;
}

try{

const adminDoc = await getDoc(
doc(db,"admins",user.uid)
);

if(!adminDoc.exists()){
$("authStatus").textContent =
"এই অ্যাকাউন্ট Admin নয়।";

await signOut(auth);
return;
}

isAdmin = true;
lockForm(false);

$("authStatus").textContent =
"Admin Login সফল: " + (user.email || user.uid);

const snap = await getDoc(adRef);

if(snap.exists()){

const data = snap.data();

$("enabled").checked = !!data.enabled;
$("title").value = data.title || "";
$("message").value = data.message || "";
$("buttonText").value = data.buttonText || "";
$("buttonUrl").value = data.buttonUrl || "";

preview(data);

showStatus("আগের বিজ্ঞাপনের তথ্য লোড হয়েছে।");

}else{

showStatus("এখনও বিজ্ঞাপন তৈরি করা হয়নি।");

}

}catch(error){

$("authStatus").textContent =
"সমস্যা: " + error.message;

}

});

$("login").addEventListener("click",async()=>{

try{

await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

}catch(error){

$("authStatus").textContent =
"Login ব্যর্থ: " + error.message;

}

});

$("logout").addEventListener("click",async()=>{

await signOut(auth);

});

$("save").addEventListener("click",async()=>{

if(!isAdmin || !auth.currentUser){
return showStatus("Admin অনুমতি নেই।");
}

try{

const buttonUrl = $("buttonUrl").value.trim();

if(buttonUrl && !/^https:\/\//i.test(buttonUrl)){
throw new Error("লিংক অবশ্যই https:// দিয়ে শুরু হতে হবে।");
}

const data = {

enabled: $("enabled").checked,

title: $("title").value.trim(),

message: $("message").value.trim(),

buttonText: $("buttonText").value.trim(),

buttonUrl: buttonUrl,

displayFrequency: "every_app_open",

delaySeconds: 0,

updatedAt: serverTimestamp(),

updatedBy: auth.currentUser.uid

};

if(!data.title || !data.message){
throw new Error("শিরোনাম ও বিবরণ লিখুন।");
}

await setDoc(adRef,data,{merge:true});

preview(data);

showStatus(
data.enabled
? "বিজ্ঞাপন Publish হয়েছে।"
: "বিজ্ঞাপন সংরক্ষিত হয়েছে, কিন্তু বন্ধ আছে।"
);

}catch(error){

showStatus("Save ব্যর্থ: " + error.message);

}

});

$("disable").addEventListener("click",async()=>{

if(!isAdmin || !auth.currentUser){
return showStatus("Admin অনুমতি নেই।");
}

try{

await setDoc(adRef,{

enabled:false,

updatedAt:serverTimestamp(),

updatedBy:auth.currentUser.uid

},{merge:true});

$("enabled").checked = false;

showStatus("বিজ্ঞাপন বন্ধ করা হয়েছে।");

}catch(error){

showStatus("বন্ধ করা যায়নি: " + error.message);

}

});

</script>
</body>
</html>
